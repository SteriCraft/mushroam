[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mushroam"
version = "0.1.0"
description = "Prévision de poussées de champignons autour de Montpellier"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "numpy>=2",
    "rasterio>=1.4",
    "pyproj>=3.6",
    "shapely>=2",
    "folium>=0.17",
    "plotly>=5.20",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mushroam = ["viz/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
